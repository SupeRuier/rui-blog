<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
<title id="title">Raw Rollout、推理上下文与训练的三节点关系</title>
<desc id="desc">原始交互记录通过上下文构造得到推理输入，推理输入通过训练样本构造进入训练。原始记录还向训练提供标签和奖励。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b402b"/></marker></defs>
<rect width="1100" height="380" fill="#faf8f3"/>
<g font-family="system-ui, -apple-system, sans-serif" fill="#242824">
<text x="32" y="36" font-size="16" fill="#687068">三个节点 · 三条边 · 六个观察维度</text>
<g fill="#fff" stroke="#c9c8be"><rect x="32" y="118" width="270" height="130" rx="5"/><rect x="415" y="118" width="270" height="130" rx="5"/><rect x="798" y="118" width="270" height="130" rx="5"/></g>
<g font-size="22" font-weight="600"><text x="52" y="154">① Raw Rollout</text><text x="435" y="154">② Inference Context</text><text x="818" y="154">③ Training</text></g>
<g font-size="17" fill="#687068"><text x="52" y="187">观测 · 动作 · 工具结果</text><text x="52" y="215">完整记录与媒体引用</text><text x="435" y="187">这次调用实际可见的输入</text><text x="435" y="215">历史选择 · 图像 · 压缩状态</text><text x="818" y="187">序列组织 · Loss Mask</text><text x="818" y="215">SFT / RL 与优化单位</text></g>
<g fill="none" stroke="#9b402b" stroke-width="2" marker-end="url(#arrow)"><path d="M302 182H407"/><path d="M685 182H790"/><path d="M167 248V324H933V256"/></g>
<g text-anchor="middle" font-size="15" fill="#9b402b"><text x="358" y="83">①→②</text><text x="358" y="104">Context Construction</text><text x="741" y="63">②→③</text><text x="741" y="84">Training Data</text><text x="741" y="105">Construction</text><rect x="400" y="306" width="300" height="34" fill="#faf8f3"/><text x="550" y="328">①→③ Labels / Rewards</text></g>
<text x="550" y="365" text-anchor="middle" font-size="15" fill="#687068">推理只使用已发生的历史；训练可以使用后验反馈作为监督</text>
</g></svg>

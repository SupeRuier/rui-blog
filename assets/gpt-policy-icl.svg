<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">GPT-Policy deployment-time in-context robot learning</title>
  <desc id="desc">Five forms of context are compiled with current observations for a fixed general vision-language model. The model selects constrained robot tools, execution feedback returns to the next decision, and human video raises two real-robot tasks from zero of three to two of three successes.</desc>
  <rect width="1200" height="700" fill="#fff"/>
  <text x="72" y="75" fill="#171817" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">GPT-POLICY · IN-CONTEXT ROBOT LEARNING</text>
  <text x="72" y="118" fill="#686b67" font-family="Inter,Arial,sans-serif" font-size="21">Fixed general-purpose VLM · no gradient update · closed-loop tool execution</text>

  <rect x="72" y="180" width="255" height="325" rx="5" fill="#f7f7f4" stroke="#d9dad5" stroke-width="2"/>
  <text x="96" y="222" fill="#171817" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">TASK CONTEXT</text>
  <g fill="#686b67" font-family="Inter,Arial,sans-serif" font-size="19">
    <text x="96" y="272">Human video</text>
    <text x="96" y="320">Robot video + actions</text>
    <text x="96" y="368">Goal image</text>
    <text x="96" y="416">Self-interaction history</text>
    <text x="96" y="464">Human interaction</text>
  </g>

  <path d="M345 342 H455" stroke="#e85434" stroke-width="4" fill="none"/>
  <path d="M443 331 L457 342 L443 353" fill="none" stroke="#e85434" stroke-width="4"/>
  <rect x="475" y="230" width="250" height="225" rx="5" fill="#171817"/>
  <text x="600" y="300" fill="#fff" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">FIXED VLM</text>
  <text x="600" y="344" fill="#fff" text-anchor="middle" font-family="Georgia,serif" font-size="35" font-weight="700">GPT-6 Astra</text>
  <text x="600" y="390" fill="#bfc1bb" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16">one structured tool request</text>

  <path d="M745 342 H855" stroke="#e85434" stroke-width="4" fill="none"/>
  <path d="M843 331 L857 342 L843 353" fill="none" stroke="#e85434" stroke-width="4"/>
  <rect x="875" y="180" width="255" height="325" rx="5" fill="#f7f7f4" stroke="#d9dad5" stroke-width="2"/>
  <text x="899" y="222" fill="#171817" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">ROBOT TOOLS</text>
  <g fill="#686b67" font-family="Inter,Arial,sans-serif" font-size="19">
    <text x="899" y="276">Validate target</text>
    <text x="899" y="324">Check IK residuals</text>
    <text x="899" y="372">Execute motion</text>
    <text x="899" y="420">Return observation</text>
    <text x="899" y="468">Report success / rejection</text>
  </g>

  <path d="M1002 525 V585 H600 V478" fill="none" stroke="#d9dad5" stroke-width="3"/>
  <path d="M589 490 L600 476 L611 490" fill="none" stroke="#d9dad5" stroke-width="3"/>
  <text x="820" y="640" fill="#686b67" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18">execution feedback → next decision</text>

  <text x="72" y="585" fill="#e85434" font-family="Georgia,serif" font-size="50" font-weight="700">0/3 → 2/3</text>
  <text x="72" y="625" fill="#686b67" font-family="Inter,Arial,sans-serif" font-size="18">human-video context · red towel and notebook pickup</text>
</svg>

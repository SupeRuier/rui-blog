<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
<title id="title">Agentic RL 从 Rollout Call Graph 构建 Training Sequences</title>
<desc id="desc">追加调用、重试、Subagent 和上下文压缩形成多根调用图，每条根到叶路径导出为一条训练序列。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b402b"/></marker>
  <style>.t{font-family:system-ui,-apple-system,sans-serif;fill:#242824}.muted{fill:#687068}.accent{fill:#9b402b}.box{fill:#fff;stroke:#c9c8be;stroke-width:1.5}.node{fill:#fff;stroke:#9b402b;stroke-width:1.8}.edge{fill:none;stroke:#9b402b;stroke-width:2}.dash{fill:none;stroke:#a6aaa3;stroke-width:1.6;stroke-dasharray:6 6}</style>
</defs>
<rect width="1120" height="540" fill="#faf8f3"/>
<g class="t">
  <text x="36" y="38" font-size="17" class="muted">Rollout 展开</text>
  <text x="692" y="38" font-size="17" class="muted">Sequence 构建</text>
  <rect x="36" y="60" width="588" height="430" rx="8" class="box"/>
  <rect x="660" y="60" width="424" height="430" rx="8" class="box"/>

  <g class="edge" marker-end="url(#arrow)">
    <path d="M164 146H265"/>
    <path d="M365 146H466"/>
    <path d="M315 176V238H466"/>
    <path d="M164 354H265"/>
  </g>
  <g>
    <rect x="64" y="116" width="100" height="60" rx="7" class="node"/>
    <rect x="265" y="116" width="100" height="60" rx="7" class="node"/>
    <rect x="466" y="116" width="120" height="60" rx="7" class="node"/>
    <rect x="466" y="238" width="120" height="60" rx="7" class="node"/>
    <rect x="64" y="324" width="100" height="60" rx="7" class="node"/>
    <rect x="265" y="324" width="120" height="60" rx="7" class="node"/>
  </g>
  <g font-size="16" text-anchor="middle">
    <text x="114" y="141">Call A</text><text x="114" y="162" class="muted" font-size="13">Root</text>
    <text x="315" y="141">Call B</text><text x="315" y="162" class="muted" font-size="13">Append</text>
    <text x="526" y="141">Call C</text><text x="526" y="162" class="muted" font-size="13">Continue</text>
    <text x="526" y="263">Call B′</text><text x="526" y="284" class="muted" font-size="13">Retry sibling</text>
    <text x="114" y="349">Call D</text><text x="114" y="370" class="muted" font-size="13">New root</text>
    <text x="325" y="349">Call E</text><text x="325" y="370" class="muted" font-size="13">Append</text>
  </g>
  <text x="64" y="90" font-size="14" class="muted">最长精确 Token 前缀决定父节点</text>
  <text x="64" y="422" font-size="14" class="muted">Subagent / Compaction 改写前缀 → 新 Root</text>
  <path d="M624 274H650" class="edge" marker-end="url(#arrow)"/>

  <g>
    <rect x="694" y="102" width="350" height="78" rx="7" class="node"/>
    <rect x="694" y="220" width="350" height="78" rx="7" class="node"/>
    <rect x="694" y="338" width="350" height="78" rx="7" class="node"/>
  </g>
  <g font-size="16">
    <text x="716" y="130">Sequence 1</text><text x="716" y="157" class="muted" font-size="14">A → B → C</text>
    <text x="716" y="248">Sequence 2</text><text x="716" y="275" class="muted" font-size="14">A → B → B′</text>
    <text x="716" y="366">Sequence 3</text><text x="716" y="393" class="muted" font-size="14">D → E</text>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="1022" y="130" class="accent">sampled tokens: mask 1</text><text x="1022" y="157" class="muted">context tokens: mask 0</text>
    <text x="1022" y="248" class="accent">sampled tokens: mask 1</text><text x="1022" y="275" class="muted">context tokens: mask 0</text>
    <text x="1022" y="366" class="accent">sampled tokens: mask 1</text><text x="1022" y="393" class="muted">context tokens: mask 0</text>
  </g>
  <path d="M694 448H1044" class="dash"/>
  <text x="869" y="472" font-size="14" text-anchor="middle" class="muted">缺失 / 错位轮可作 Context，不作 Target</text>
  <text x="560" y="522" font-size="14" text-anchor="middle" class="muted">Graph 保留 Harness 控制流；Sequence 只合并真正连续的前缀</text>
</g>
</svg>

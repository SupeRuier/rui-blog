<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <title>{{siteTitle}}</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css?v={{cssVersion}}">
</head>
<body>
  <header class="site-header wrap">
    <a class="brand" href="./" aria-label="返回首页">Rui<span class="brand-dot">.</span></a>
    <nav aria-label="主导航"><a href="#notes">技术笔记</a><a href="#scope">范围</a></nav>
  </header>

  <main>
    <section class="intro wrap">
      <p class="eyebrow">{{eyebrow}}</p>
      <h1>{{tagline}}</h1>
      <p class="lede">{{lede}}</p>
    </section>

    <section class="writing wrap" id="notes">
      <div class="section-heading"><h2>{{notesHeading}}</h2><span>{{noteCount}} NOTES</span></div>
{{cards}}
    </section>

    <section class="about wrap" id="scope">
      <div class="section-heading"><h2>{{scopeHeading}}</h2><span>{{scopeEyebrow}}</span></div>
      <p>{{scopeText}}</p>
    </section>
{{refSection}}
  </main>
  <footer class="wrap"><span>© {{year}} {{author}}</span><span>{{footerNote}}</span></footer>
</body>
</html>
